name: Testen und paketieren

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version, z. B. v0.1.0. Legt Tag und Release auf dem gewählten Stand an. Leer = nur Artefakt bauen.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Test und ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Version bestimmen
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          RELEASE="false"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            RELEASE="true"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            if [[ ! "${INPUT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Ungültige Version '${INPUT_VERSION}', erwartet z. B. v0.1.0" >&2
              exit 1
            fi
            VERSION="${INPUT_VERSION}"
            RELEASE="true"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten installieren
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Testen
        run: npm test

      - name: Bauen und packen
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node tools/build.cjs --version "${VERSION}" --out "dist/SAFe-WSJF"
          (cd dist && zip -r -q "SAFe-WSJF-${VERSION}.zip" SAFe-WSJF)

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SAFe-WSJF-${{ steps.version.outputs.version }}
          path: dist/SAFe-WSJF-${{ steps.version.outputs.version }}.zip

      - name: Release anlegen
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release create "${VERSION}" "dist/SAFe-WSJF-${VERSION}.zip" --target "${GITHUB_SHA}" --title "SAFe WSJF ${VERSION}" --generate-notes
          else
            gh release upload "${VERSION}" "dist/SAFe-WSJF-${VERSION}.zip" --clobber
          fi
