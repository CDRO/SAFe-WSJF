<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;overflow:hidden;font-family:Inter,sans-serif;color:#e6eaf0;
  background:radial-gradient(1200px 700px at 85% 40%,#1c2a44 0%,#111827 55%,#0b1020 100%);}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;gap:56px;align-items:center}
.left{flex:1 1 0;min-width:0}
.eyebrow{font:600 18px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:#7aa2f7;margin-bottom:22px}
h1{font:800 92px/1 'Inter Display',Inter;letter-spacing:-.02em;color:#fff}
h1 span{color:#5b8cf5}
.tag{margin-top:24px;font:500 24px/1.45 Inter;color:#c7cfdb;max-width:600px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.chip{font:600 17px/1 Inter;padding:10px 14px;border-radius:999px;background:rgba(91,140,245,.14);color:#b9cdfa;border:1px solid rgba(91,140,245,.35)}
.formula{margin-top:34px;font:500 21px/1 'JetBrains Mono',monospace;color:#9aa5b5}
.formula b{color:#fff;font-weight:700}
.right{flex:0 0 470px;display:flex;flex-direction:column;gap:18px}
.gl{font:600 14px/1 Inter;color:#9aa5b5;margin-bottom:7px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);position:relative}
.cell{height:26px;border-radius:4px;position:relative}
.card{position:absolute;left:3px;right:3px;top:3px;bottom:3px;background:#fff;border-radius:3px;border-left:3px solid #2563eb;
  font:700 9px/1 Inter;color:#1c2430;display:flex;align-items:center;padding-left:4px;box-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden}
</style></head><body><div class="wrap">
<div class="left">
  <div class="eyebrow">Weighted Shortest Job First</div>
  <h1>SAFe <span>WSJF</span></h1>
  <p class="tag">Features priorisieren direkt im Browser:<br>ohne Server, ohne Installation, ohne Adminrechte.</p>
  <div class="chips"><span class="chip">Jira-CSV rein &amp; raus</span><span class="chip">SQLite je Zug</span><span class="chip">Präsentationsmodus</span></div>
  <div class="formula">WSJF = <b>(UBV + RROE + TC)</b> / <b>Job Size</b></div>
</div>
<div class="right">
  <div><div class="gl"><span>Direkter Nutzen →</span><span>↓ Zukünftiger Nutzen</span></div><div class="grid" id="g1"></div></div>
  <div><div class="gl"><span>Dringlichkeit →</span><span>↓ Dauer</span></div><div class="grid" id="g2"></div></div>
</div></div>
<script>
const S=[1,2,3,5,8,13,20],n=v=>(v-1)/19;
const cards={g1:{'8|3':'ART-101','5|8':'ART-103','13|5':'ART-110','20|13':'ART-104','2|2':'ART-105'},g2:{'5|5':'ART-101','13|8':'ART-103','8|13':'ART-110','20|1':'ART-104','3|3':'ART-105'}};
for(const [id,hue,sat] of [['g1',205,50],['g2',10,50]]){const g=document.getElementById(id);
 for(const y of S)for(const x of S){const c=document.createElement('div');c.className='cell';
  c.style.background=`hsl(${hue},${sat}%,${90-50*n(y)-20*n(x)}%)`;const k=cards[id][x+'|'+y];
  if(k){const d=document.createElement('div');d.className='card';d.textContent=k;c.append(d)}g.append(c)}}
</script></body></html>
